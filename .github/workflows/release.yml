name: Auto-release

# Publishes a release for every main commit that passed CI:
#   1. CI succeeds on a push to main (or the workflow is dispatched by hand).
#   2. If package.json carries a version that has no tag yet, that version is
#      tagged as-is (manual minor/major bumps). Otherwise the patch version is
#      bumped with scripts/bump-version.cjs (package.json, package-lock.json,
#      and the CHANGELOG rollover) and committed straight to main.
#   3. The commit is tagged v<version> and a GitHub release is created.
#   4. The tagged version is published to npm as `gsd-for-omp` with
#      `npm publish --provenance`. That registry is the source used by
#      `gsd-for-omp update`. The step is skipped when the version is already on
#      npm and also runs for an already tagged HEAD, so re-running the workflow
#      after a failed publish completes the release.
#
# npm authentication uses trusted publishing (OIDC, `id-token: write`): the
# package's trusted publisher on npmjs.com must point at this repository and
# the `release.yml` workflow. No NPM_TOKEN secret is used or needed.
#
# The bump commit is pushed with GITHUB_TOKEN, which does not trigger another
# workflow run, so releases never loop. If main gets a ruleset that blocks
# direct pushes, allow github-actions to bypass it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js 24 and the npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org

      - name: Resolve release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ "${head_sha}" != "${TESTED_SHA}" ]; then
            # main moved on after this CI run; the newer commit's run releases it.
            echo "main is at ${head_sha}, CI tested ${TESTED_SHA}; skipping"
            echo "action=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          version="$(node -p "require('./package.json').version")"
          # `gh api` prints the error body on stdout for a 404 (no release yet),
          # so only trust its output when it exits successfully.
          if ! latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null)"; then
            latest_tag=""
          fi
          head_tag="$(git tag --points-at HEAD --list "v${version}")"
          echo "version=${version} latest_tag=${latest_tag:-<none>} head_tag=${head_tag:-<none>}"
          if [ -n "${head_tag}" ]; then
            echo "action=none" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            # package.json carries a version that was never tagged (manual bump).
            echo "action=tag" >> "$GITHUB_OUTPUT"
            echo "new_version=${version}" >> "$GITHUB_OUTPUT"
          else
            new_version="$(node -e "const [a, b, c] = process.argv[1].split('.').map(Number); console.log([a, b, c + 1].join('.'))" "${version}")"
            echo "action=bump" >> "$GITHUB_OUTPUT"
            echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          fi
          # Release notes start after the latest release, or after the nearest
          # earlier tag before the first release (the inherited gsd-omp tags).
          prev_tag="${latest_tag:-$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)}"
          echo "prev_tag=${prev_tag}" >> "$GITHUB_OUTPUT"

      - name: Bump version on main
        if: steps.state.outputs.action == 'bump'
        run: |
          set -euo pipefail
          new_version="${{ steps.state.outputs.new_version }}"
          node scripts/bump-version.cjs "${new_version}"
          node --test test/release-metadata.test.cjs
          git add -A
          git -c user.name="gsd-for-omp release bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: release gsd-for-omp v${new_version}"
          if ! git push origin HEAD:main; then
            echo "main moved during the release; the next CI run releases it"
            exit 1
          fi

      - name: Tag and create GitHub release
        if: steps.state.outputs.action != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          PREV_TAG: ${{ steps.state.outputs.prev_tag }}
        run: |
          set -euo pipefail
          tag="v${{ steps.state.outputs.new_version }}"
          sha="$(git rev-parse HEAD)"
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            git tag "${tag}" "${sha}"
            git push origin "refs/tags/${tag}"
          fi
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${tag} already exists"
            exit 0
          fi
          if [ -n "${PREV_TAG}" ]; then
            notes="$(git log --format='- %s' "${PREV_TAG}..${sha}" | grep -v '^- chore: release gsd-for-omp v' || true)"
            notes="${notes}

          **Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${tag}"
          else
            notes="Initial release."
          fi
          gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "gsd-for-omp ${tag}" --notes "${notes}"
          echo "published ${tag} at ${sha}"

      - name: Publish to npm
        if: steps.state.outputs.current == 'true'
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # Runs for every CI-tested HEAD that carries its release tag, so a
          # re-run after a failed publish still publishes the tagged version.
          if [ -z "$(git tag --points-at HEAD --list "v${version}")" ]; then
            echo "HEAD is not tagged v${version}; refusing to publish"
            exit 1
          fi
          # Anonymous lookup: setup-node's placeholder auth token must not be sent.
          published="$(npm view "gsd-for-omp@${version}" version --userconfig /dev/null --registry https://registry.npmjs.org 2>/dev/null || true)"
          if [ "${published}" = "${version}" ]; then
            echo "gsd-for-omp@${version} is already on npm; nothing to publish"
            exit 0
          fi
          # Trusted publishing (OIDC) needs npm 11.5.1 or newer.
          npm install --global 'npm@^11.5.1'
          npm --version
          npm ci
          npm publish --provenance --access public
          echo "published gsd-for-omp@${version} to npm"
